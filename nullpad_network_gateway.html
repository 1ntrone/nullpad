function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}

function animateLine(text="",className=""){
 return new Promise(resolve=>{
  const line=document.createElement("div");
  line.className="line "+className;
  screen.appendChild(line);
  let i=0;
  function type(){
   if(i<text.length){
    line.textContent+=text[i++];
    screen.scrollTop=screen.scrollHeight;
    setTimeout(type,5);
   }else resolve();
  }
  type();
 });
}

function print(text="",className=""){
 outputQueue=outputQueue.then(()=>animateLine(text,className));
 return outputQueue;
}

function clearScreen(){screen.innerHTML=""}

function separator(){
 return print("-----------------------------------------------","dim");
}

function header(title){
 return separator().then(()=>print(" // "+title,"section")).then(()=>separator());

function caesar(text,shift){
 return text.split("").map(char=>{
  if(char>="A"&&char<="Z"){
   return String.fromCharCode((char.charCodeAt(0)-65+shift)%26+65);
  }
  return char;
 }).join("");
}

const reservedAgents=new Set(["NP","NP_qbvm","NP_zht","NP_","test"]);
const availableDepartments=["DEP-001","DEP-002","DEP-003","DEP-004"];

agents.filter(agent=>!reservedAgents.has(agent.id)).forEach((agent,index)=>{
 const departmentId=availableDepartments[index%availableDepartments.length];
 const department=departments.find(d=>d.id===departmentId);
 department.members.push(agent.id);
});

const agentAssignments={};

departments.forEach(department=>{
 const roles=departmentRoles[department.id];
 let roleIndex=0;

 department.members.forEach(agentId=>{
  if(agentId===department.leader){
   agentAssignments[agentId]={
    departmentId:department.id,
    role:"DEPARTMENT DIRECTOR",
    responsibilities:"Leads the department, coordinates its members and oversees departmental responsibilities."
   };
   return;
  }

  if(agentId==="test"){
   agentAssignments[agentId]={
    departmentId:department.id,
    role:"SENIOR RESEARCHER",
    responsibilities:"Leads assigned research reviews and supports anomaly analysis."
   };
   return;
  }

  const role=roles[roleIndex%roles.length];
  roleIndex++;

  agentAssignments[agentId]={
   departmentId:department.id,
   role:role[0],
   responsibilities:role[1]
  };
 });
});

function getAgent(id){
 return agents.find(agent=>agent.id.toLowerCase()===id.toLowerCase());

function getDepartment(id){
 return departments.find(department=>department.id===id);

function getOperation(id){
 return operations.find(operation=>operation.id.toLowerCase()===id.toLowerCase());
}
function getProject(id){
 return projects.find(project=>project.id.toLowerCase()===id.toLowerCase());
}

 if(!history.length){
  print("No commands recorded.");
  return;
 }
 history.forEach((command,index)=>{
  print(String(index+1).padStart(3,"0")+" | "+command);
 });
 separator();
}

function showData(){
 header("ARCHIVE DATA");
 print("AGENT RECORDS: "+agents.length);
 print("DEPARTMENT RECORDS: "+departments.length);
 print("OPERATION RECORDS: "+operations.length);
 print("PROJECT RECORDS: "+projects.length);
 print("REPORT RECORDS: "+reports.length);
 print("ASSIGNMENT RECORDS: "+Object.keys(agentAssignments).length);
 print("DATABASE INTEGRITY: "+(Object.keys(agentAssignments).length===agents.length?"VERIFIED":"CHECK REQUIRED"));
 separator();
}

function showServices(){
 header("SYSTEM SERVICES");
 print("ARCHIVE DATABASE ........ ONLINE","success");
 print("AGENT REGISTRY .......... ONLINE","success");
 print("OPERATION TRACKER ....... ONLINE","success");
 print("PROJECT DATABASE ........ ONLINE","success");
 print("REPORT SERVICE .......... ONLINE","success");
 print("AUTHENTICATION .......... ONLINE","success");
 print("TERMINAL INTERFACE ...... ONLINE","success");
 separator();
}

function showLogs(){
 header("SYSTEM LOGS");
 logs.forEach((entry,index)=>{
  print("["+String(index+1).padStart(3,"0")+"] "+entry);
 });
 separator();
}

function login(){
 if(loggedIn){
  print("SESSION ALREADY AUTHENTICATED.","warning");
  return;
 }
 loginStage=1;
 print("ENTER OPERATOR PASSWORD:");
}

function logout(){
 loggedIn=false;
 elevated=false;
 loginStage=0;
 accessStage=0;
 print("SESSION TERMINATED.","warning");
}

function requestAccess(){
 if(!requireLogin())return;
 if(elevated){
  print("ELEVATED CLEARANCE ALREADY ACTIVE.","success");
  return;
 }
 accessStage=1;
 print("ENTER ARCHIVE ACCESS KEY:");
}

function processCommand(raw){
 const command=raw.trim();
 if(!command)return;

 history.push(command);
 historyIndex=history.length;

 if(loginStage===1){
  loginStage=0;
  if(command===LOGIN_PASSWORD){
   loggedIn=true;
   print("AUTHENTICATION SUCCESSFUL.","success");
   print("WELCOME, OPERATOR NP.");
  }else{
   print("AUTHENTICATION FAILED.","error");
  }
  return;
 }

 if(accessStage===1){
  accessStage=0;
  if(command===ACCESS_PASSWORD){
   elevated=true;
   print("ELEVATED CLEARANCE GRANTED.","success");
   print("RESTRICTED ARCHIVE ACCESS ENABLED.");
  }else{
   print("ACCESS KEY INVALID.","error");
  }
  return;
 }

 const parts=command.split(/\s+/);
 const main=parts[0].toLowerCase();
 const sub=parts[1]?.toLowerCase();
 const arg=parts[2];

 switch(main){
  case "help":
   showHelp();
   break;

  case "login":
   login();
   break;

  case "logout":
   logout();
   break;

  case "access":
   requestAccess();
   break;

  case "clear":
   clearScreen();
   break;

  case "status":
   showStatus();
   break;

  case "agents":
   if(sub==="info"&&arg){
    showAgentsInfo(arg);
   }else if(sub==="info"){
    showAgentsInfo();
   }else if(sub==="open"&&arg){
    showAgentProfile(arg);
   }else{
    showAgents();
   }
   break;

  case "departments":
   if(sub==="open"&&arg){
    showDepartmentProfile(arg.toUpperCase());
   }else{
    showDepartments();
   }
   break;

  case "operations":
   if(sub==="open"&&arg){
    showOperationDetails(arg);
   }else{
    showOperations();
   }
   break;

  case "projects":
   if(sub==="open"&&arg){
    showProjectDetails(arg);
   }else{
    showProjects();
   }
   break;

  case "reports":
   if(sub==="open"&&arg){
    showReportDetails(arg);
   }else{
    showReports();
   }
   break;

  case "history":
   showHistory();
   break;

  case "data":
   showData();
   break;

  case "services":
   showServices();
   break;

  case "logs":
   showLogs();
   break;

  default:
   print("UNKNOWN COMMAND: "+command,"error");
   print("Type HELP to view available commands.","dim");
 }
}

input.addEventListener("keydown",event=>{
 if(event.key==="Enter"){
  const command=input.value;
  input.value="";
  print("NULLPAD> "+command,"dim");
  processCommand(command);
 }
 if(event.key==="ArrowUp"){
  event.preventDefault();
  if(historyIndex>0){
   historyIndex--;
   input.value=history[historyIndex];
  }
 }
 if(event.key==="ArrowDown"){
  event.preventDefault();
  if(historyIndex<history.length-1){
   historyIndex++;
   input.value=history[historyIndex];
  }else{
   historyIndex=history.length;
   input.value="";
  }
 }
});

document.addEventListener("click",()=>input.focus());
input.focus();
</script>
</body>
