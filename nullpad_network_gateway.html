<meta charset="UTF-8">

<title>NULLPAD // Internal Terminal</title>

<style>
:root {
    --bg: #080b0d;
    --panel: #0d1316;
    --green: #00ff9c;
    --green-dim: #00a968;
    --text: #c4d5ce;
    --muted: #657b72;
    --red: #ff4545;
    --yellow: #ffc857;
    --border: #183b30;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: var(--bg);
    color: var(--text);
    font-family: Consolas, "Courier New", monospace;
    min-height: 100vh;
}

.hidden {
    display: none !important;
}

.login-box {
    width: min(420px, 100%);
    margin: 10vh auto;
    padding: 28px;
    background: var(--panel);
    border: 1px solid var(--border);
    box-shadow: 0 0 30px #00ff9c12;
}

.logo {
    color: var(--green);
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 5px;
    text-align: center;
    margin-bottom: 8px;
}

.subtitle {
    color: var(--muted);
    text-align: center;
    font-size: 11px;
    margin-bottom: 28px;
}

input, button {
    font-family: inherit;
}

.login-box input {
    width: 100%;
    margin: 8px 0;
    padding: 12px;
    color: var(--green);
    background: #050809;
    border: 1px solid var(--border);
    outline: none;
}

button {
    cursor: pointer;
}

.login-box button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    background: #06271b;
    color: var(--green);
    border: 1px solid var(--green-dim);
}

.login-box button:hover {
    background: #0b3b29;
}

#loginError {
    color: var(--red);
    font-size: 12px;
    margin-top: 12px;
    min-height: 16px;
}

.terminal {
    max-width: 1100px;
    margin: 0 auto;
    border: 1px solid var(--border);
    background: var(--panel);
    box-shadow: 0 0 30px #00ff9c0a;
}

.topbar {
    padding: 15px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
}

.topbar strong {
    color: var(--green);
    letter-spacing: 3px;
}

.status {
    color: var(--green);
    font-size: 12px;
}

.content {
    padding: 20px;
}

.welcome {
    color: var(--green);
    font-size: 13px;
    line-height: 1.7;
    margin-bottom: 20px;
}

#output {
    min-height: 350px;
    max-height: 58vh;
    overflow-y: auto;
    padding: 15px;
    background: #050809;
    border: 1px solid #142c24;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 1.55;
    font-size: 13px;
}

.line {
    margin-bottom: 5px;
}

.green { color: var(--green); }
.red { color: var(--red); }
.yellow { color: var(--yellow); }
.muted { color: var(--muted); }

.input-row {
    display: flex;
    margin-top: 12px;
    gap: 10px;
}

.prompt {
    color: var(--green);
    padding-top: 12px;
}

#commandInput {
    flex: 1;
    min-width: 0;
    padding: 12px;
    background: #050809;
    border: 1px solid var(--border);
    color: var(--green);
    outline: none;
}

#commandInput:focus {
    border-color: var(--green);
}

#sendButton {
    padding: 0 20px;
    color: var(--green);
    background: #06271b;
    border: 1px solid var(--green-dim);
}

.footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
}

@media(max-width: 600px) {
    body { padding: 8px; }
    .content { padding: 12px; }
    #output { font-size: 12px; }
    .prompt { display: none; }
}
</style>
</head>

<!-- LOGIN -->
<div class="login-box" id="loginScreen">
    <div class="logo">NULLPAD</div>
    <div class="subtitle">INTERNAL ORGANIZATION TERMINAL // ACCESS REQUIRED</div>

    <input id="loginInput" placeholder="USER ID" autocomplete="off">
    <input id="passwordInput" type="password" placeholder="PASSWORD">

    <button onclick="login()">AUTHORIZE ACCESS</button>
    <div id="loginError"></div>

    <div class="subtitle" style="margin-top:22px;margin-bottom:0">
        UNAUTHORIZED ACCESS IS PROHIBITED
    </div>
</div>

    </div>

            ACCESS LEVEL: AUTHORIZED<br>
            TYPE <span class="green">Help</span> TO VIEW AVAILABLE COMMANDS.

        <div id="output"></div>

            <span class="prompt">NP://</span>
            <input id="commandInput" placeholder="Enter command..." autocomplete="off">
            <button id="sendButton" onclick="runCommand()">EXECUTE</button>

    </div>

    <div class="footer">
        <span>NULLPAD INTERNAL NETWORK</span>
        <span id="clock"></span>

   LOGIN CONFIGURATION
   Демонстрационная авторизация.
   Не является настоящей защитой данных.
========================================== */

const LOGIN_USER = "admin";
const LOGIN_PASSWORD = "NULLPAD";

function login() {
    const user = document.getElementById("loginInput").value.trim();
    const password = document.getElementById("passwordInput").value;

    if (user === LOGIN_USER && password === LOGIN_PASSWORD) {
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("terminalScreen").classList.remove("hidden");

        print("NULLPAD SYSTEM INITIALIZED.", "green");
        print("Welcome, " + user + ".", "green");
        print("Database connection established.");
        print("Type Help to view commands.");
    } else {
        document.getElementById("loginError").textContent =
            "ACCESS DENIED // INVALID CREDENTIALS";
    }
}

document.getElementById("passwordInput").addEventListener("keydown", e => {
    if (e.key === "Enter") login();
});

document.getElementById("loginInput").addEventListener("keydown", e => {
    if (e.key === "Enter") login();
});

/* ==========================================
   OUTPUT SYSTEM
========================================== */

const output = document.getElementById("output");

function print(message, color = "") {
    const line = document.createElement("div");
    line.className = "line " + color;
    line.textContent = message;
    output.appendChild(line);
    output.scrollTop = output.scrollHeight;
}

function printBlank() {
    print("");
}

function heading(text) {
    print("========================================", "muted");
    print(text, "green");
    print("========================================", "muted");
}

function field(label, value) {
    print(label.padEnd(19, " ") + ": " + value);
}

function notFound(type, id) {
    print(type + " NOT FOUND: " + id, "red");
    print("Check the ID and try again.", "muted");
}

function getAgent(id) {
    return agents.find(a => a.id.toLowerCase() === id.toLowerCase());
}

function getDepartment(id) {
    return departments.find(d => d.id.toLowerCase() === id.toLowerCase());
}

function getOperation(id) {
    return operations.find(o => o.id.toLowerCase() === id.toLowerCase());
}

function getProject(id) {
    return projects.find(p => p.id.toLowerCase() === id.toLowerCase());
}

function statusColor(status) {
    if (status === "ACTIVE") return "green";
    if (status === "COMPLETED") return "muted";
    if (status === "UNDER REVIEW") return "yellow";
    return "";
}

/* ==========================================

function showAgents() {

    agents.forEach(agent => {

    });

    print("TOTAL AGENTS: " + agents.length, "green");

function showAgentProfile(id) {
    const agent = getAgent(id);

    if (!agent) return notFound("AGENT", id);

    heading("AGENT PROFILE // " + agent.id);

    field("NAME", agent.name);
    field("ROLE", agent.role);
    field("DEPARTMENT", agent.department);

    printBlank();
    print("DESCRIPTION:");
    print(agent.description);

    printBlank();
    print("RESPONSIBILITIES:");

    agent.responsibilities.forEach((task, index) => {
        print((index + 1) + ". " + task);
    });

    printBlank();
    print("RELATED OPERATIONS:");

    const related = operations.filter(o => o.agents.includes(agent.id));

    if (!related.length) {
        print("No linked operations.");
    } else {
        related.forEach(o => print(o.id + " // " + o.title));
    }

    printBlank();
    print("RELATED PROJECTS:");

    const relatedProjects = projects.filter(p => p.team.includes(agent.id));

    if (!relatedProjects.length) {
        print("No linked projects.");
    } else {
        relatedProjects.forEach(p => print(p.id + " // " + p.name));
    }
}

/* ==========================================
   COMMAND PROCESSOR
========================================== */

function runCommand() {
    const input = document.getElementById("commandInput");
    const raw = input.value.trim();

    if (!raw) return;

    print("NP:// " + raw, "green");
    input.value = "";

    const args = raw.split(/\s+/);
    const command = args[0].toLowerCase();
    const subcommand = args[1] ? args[1].toLowerCase() : "";
    const id = args[2] || "";

    if (command === "help") {
        showHelp();
        return;
    }

    if (command === "clear") {
        output.innerHTML = "";
        return;
    }

    if (command === "status") {
        showStatus();
        return;
    }

    if (command === "database") {
        showDatabase();
        return;
    }

    if (command === "logout") {
        document.getElementById("terminalScreen").classList.add("hidden");
        document.getElementById("loginScreen").classList.remove("hidden");
        document.getElementById("passwordInput").value = "";
        document.getElementById("loginError").textContent = "";
        output.innerHTML = "";
        return;
    }

    if (command === "agents") {
        if (!subcommand) {
            showAgents();
        } else if (subcommand === "info") {
            showAgentsInfo();
        } else if (subcommand === "open" && id) {
            showAgentProfile(id);
        } else {
            print("INVALID AGENTS COMMAND.", "red");
            print("Try: Agents | Agents Info | Agents open NP");
        }
        return;
    }

    if (command === "departments") {
        if (!subcommand) {
            showDepartments();
        } else if (subcommand === "open" && id) {
            showDepartmentProfile(id);
        } else {
            print("INVALID DEPARTMENTS COMMAND.", "red");
            print("Try: Departments | Departments open DEP-001");
        }
        return;
    }

    if (command === "operations") {
        if (!subcommand) {
            showOperations();
        } else if (subcommand === "open" && id) {
            showOperationProfile(id);
        } else if (subcommand === "reports" && id) {
            showOperationReports(id);
        } else if (subcommand === "history" && id) {
            showOperationHistory(id);
        } else {
            print("INVALID OPERATIONS COMMAND.", "red");
            print("Try: Operations | Operations open OP-081");
            print("Try: Operations reports OP-081");
            print("Try: Operations history OP-081");
        }
        return;
    }

    if (command === "projects") {
        if (!subcommand) {
            showProjects();
        } else if (subcommand === "open" && id) {
            showProjectProfile(id);
        } else if (subcommand === "operations" && id) {
            showProjectOperations(id);
        } else if (subcommand === "reports" && id) {
            showProjectReports(id);
        } else if (subcommand === "history" && id) {
            showProjectHistory(id);
        } else {
            print("INVALID PROJECTS COMMAND.", "red");
            print("Try: Projects | Projects open 001");
            print("Try: Projects operations 001");
            print("Try: Projects reports 001");
            print("Try: Projects history 001");
        }
        return;
    }

    print("UNKNOWN COMMAND: " + raw, "red");
    print("Type Help to view available commands.", "muted");
}

document.getElementById("commandInput").addEventListener("keydown", e => {
    if (e.key === "Enter") runCommand();
});
