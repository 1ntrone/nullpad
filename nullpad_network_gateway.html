
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NULLPAD // TERMINAL</title>

<style>
:root {
    --bg: #030604;
    --green: #42ff82;
    --dim: #52745c;
    --text: #b8cbbd;
    --red: #ff4545;
    --border: #173321;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Consolas, "Courier New", monospace;
    font-size: 13px;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background: repeating-linear-gradient(
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,.13) 4px
    );
}

#terminal {
    width: min(1050px, 94%);
    margin: 35px auto;
    min-height: calc(100vh - 70px);
    border: 1px solid var(--border);
    background: rgba(5,12,7,.96);
    box-shadow: 0 0 35px rgba(66,255,130,.035);
    display: flex;
    flex-direction: column;
}

.topbar {
    padding: 13px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    color: var(--dim);
    font-size: 10px;
    letter-spacing: 2px;
}

.logo {
    color: var(--green);
    font-weight: bold;
    letter-spacing: 4px;
}

#screen {
    padding: 25px;
    flex: 1;
    overflow-wrap: anywhere;
}

.line {
    line-height: 1.8;
    white-space: pre-wrap;
    margin-bottom: 3px;
}

.green { color: var(--green); }
.dim { color: var(--dim); }
.red { color: var(--red); }
.white { color: #e1eee4; }

.separator {
    color: #24412c;
}

.command-line {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-top: 8px;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
}

.prompt {
    color: var(--green);
    white-space: nowrap;
}

#command {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--green);
    font: inherit;
    caret-color: var(--green);
}

#command::placeholder {
    color: #36513d;
}

.footer {
    padding: 10px 18px;
    border-top: 1px solid var(--border);
    color: #3d5544;
    font-size: 9px;
    letter-spacing: 2px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
}

.cursor {
    display: inline-block;
    width: 7px;
    height: 13px;
    background: var(--green);
    vertical-align: middle;
    animation: blink 1s steps(2) infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

@keyframes appear {
    from { opacity: 0; }
    to { opacity: 1; }
}

#screen .line {
    animation: appear .15s ease;
}

@media(max-width:600px) {
    #terminal {
        width: 100%;
        margin: 0;
        min-height: 100vh;
        border: none;
    }

    #screen { padding: 17px; }
    .topbar { font-size: 9px; }
    .footer { font-size: 8px; }
}
</style>
</head>

<body>

<div id="terminal">

    <div class="topbar">
        <span class="logo">NULLPAD</span>
        <span>METAPHYSICAL SCIENCES DIVISION</span>
        <span id="connection">INITIALIZING</span>
    </div>

    <div id="screen"></div>

    <div class="command-line">
        <span class="prompt">root@nullpad:~$</span>
        <input
            id="command"
            type="text"
            placeholder="Enter command..."
            autocomplete="off"
            spellcheck="false"
            autofocus
        >
    </div>

    <div class="footer">
        <span>NULLPAD TERMINAL // NG-001</span>
        <span id="clock">SYSTEM ONLINE</span>
    </div>

</div>

<script>
const screen = document.getElementById("screen");
const input = document.getElementById("command");
const connection = document.getElementById("connection");

let history = [];
let historyIndex = 0;
let authenticated = false;
let currentDirectory = "root";
let currentProject = null;

const documents = {
    "001": {
        title: "FRESHLlKE INCIDENT",
        project: "PROJECT 001",
        address: "freshlike.gaming",
        lead: "NP_qbvm",
        status: "ACTIVE",
        sections: [
            ["INITIAL DISCOVERY",
            "The investigation began after unusual occurrences were reported on FreshLike. Initially considered isolated technical issues, repeated reports suggested possible connections."],

            ["UNIDENTIFIED FOOTSTEPS",
            "Footstep sounds reportedly heard inside caves and near players. No confirmed explanation has been established."],

            ["VILLAGE GENERATION",
            "Villages have reportedly generated inconsistently. Some structures appear incomplete or differently arranged."],

            ["CHUNK DISAPPEARANCE",
            "Players reported chunks disappearing from previously explored areas. Server-side verification remains incomplete."],

            ["CIVILIAN REPORT",
            "An additional report was submitted by a player whose identity remains restricted. Source status: UNVERIFIED."],

            ["PROJECT NP_qbvm",
            "Current project lead. Responsible for coordinating the investigation and maintaining documentation."],

            ["AGENT NP_zht",
            "Field observer operating on FreshLike. Responsible for collecting reports and documenting unusual events."],

            ["RESTRICTED PERSONNEL",
            "NP_mvpg — CLASS A\n test — CLASS A\nPersonnel responsibilities remain restricted."],

            ["INVESTIGATION STATUS",
            "The investigation remains active. Additional observations and reproducible evidence are required."]
        ]
    },

    "817": {
        title: "RASEBALO'S ANOMALY SERVER",
        project: "PROJECT 817",
        address: "rasebalo.fun",
        lead: "NP_zht",
        status: "ONGOING",
        sections: [
            ["OPERATION OVERVIEW",
            "Operation 817 concerns the investigation of RaseCraft, a Minecraft server operating under rasebalo.fun. The investigation is assigned to Sector A-541."],

            ["SERVER ENVIRONMENT",
            "Server: RaseCraft\nAddress: rasebalo.fun\nVersion: 1.7.10 (REPORTED)\nPlugins: 2 REPORTED\nDatapacks: 0 REPORTED\nConsole access: NOT CONNECTED."],

            ["UNDERGROUND PASSAGE NETWORK",
            "Extensive underground tunnels have reportedly been observed. Some passages may approach 9,000 blocks.\n\nReported directions:\nSouth — passages reported.\nWest — additional sections.\nEast — passages continue.\nNorth — further routes.\nNorth-West — additional network."],

            ["AUDIO IRREGULARITIES",
            "Unusual cave ambience has reportedly been heard outside identifiable cave areas. Some players could not determine the source or direction of sounds. No complete recordings are attached."],

            ["WORLD GENERATION",
            "Reports concern caves, mountains, villages and dungeons. Some structures reportedly appear incomplete or unusually arranged."],

            ["CHUNK DISAPPEARANCE",
            "Players reported chunks absent from previously explored areas. Potential explanations include world corruption, incomplete loading and server-side faults."],

            ["CIVILIAN INTERVIEWS",
            "25 former players were identified as potential sources.\n18 reportedly contacted or interviewed.\n7 not yet interviewed.\nSource reliability: MIXED."],

            ["POST-INTERVIEW ACTIVITY",
            "Some interviewed players were reportedly not seen logging into the server during subsequent observation periods. No causal connection has been established."],

            ["FIELD AGENT NP_zht",
            "Responsible for documenting field observations, submitted screenshots and civilian reports."],

            ["INVESTIGATION LIMITATIONS",
            "No direct server console connection.\nNo complete log archive.\nPlugin configuration unverified.\nSome statements unverified.\nTunnel network not fully mapped.\nNo complete audio recordings."],

            ["CURRENT ASSESSMENT",
            "Operation 817 remains open. Further observations should prioritize reproducible evidence, exact locations and preservation of original screenshots."]
        ]
    }
};

function print(text = "", color = "") {
    const div = document.createElement("div");
    div.className = "line " + color;
    div.textContent = text;
    screen.appendChild(div);
    window.scrollTo(0, document.body.scrollHeight);
}

function separator() {
    print("--------------------------------------------", "dim");
}

function clearScreen() {
    screen.innerHTML = "";
}

function help() {
    separator();
    print("AVAILABLE COMMANDS", "green");
    separator();

    const commands = [
        ["help", "Display available commands"],
        ["status", "Display system status"],
        ["about", "Information about NULLPAD"],
        ["projects", "List registered projects"],
        ["connect", "Display network endpoints"],
        ["database", "Open database directory"],
        ["open 001", "Open FreshLike investigation"],
        ["open 817", "Open Rasebalo investigation"],
        ["read", "Read current document"],
        ["info", "Current document information"],
        ["back", "Return to database"],
        ["clear", "Clear terminal"],
        ["date", "Display system date"],
        ["whoami", "Display current clearance"],
        ["logout", "Terminate current session"]
    ];

    commands.forEach(([name, description]) => {
        print(name.padEnd(18) + " - " + description, "white");
    });

    separator();
}

function showStatus() {
    print("NULLPAD SYSTEM STATUS", "green");
    separator();
    print("SYSTEM .............. OPERATIONAL");
    print("GATEWAY ID .......... NG-001");
    print("NETWORK ............. INITIALIZED");
    print("DATABASE ............ AVAILABLE");
    print("ACCESS LEVEL ........ " + (authenticated ? "CLASS D" : "UNAUTHENTICATED"));
    print("REGISTERED PROJECTS . 02");
    print("ACTIVE CASES ........ 02");
    separator();
}

function showProjects() {
    print("REGISTERED PROJECT DIRECTORY", "green");
    separator();

    print("[001] FRESHLlKE", "white");
    print("      ADDRESS: freshlike.gaming");
    print("      STATUS: ACTIVE");
    print("");

    print("[817] RASEBALO'S ANOMALY SERVER", "white");
    print("      ADDRESS: rasebalo.fun");
    print("      STATUS: ONGOING");

    separator();
    print("Use OPEN 001 or OPEN 817 to access a record.", "dim");
}

function showDatabase() {
    currentDirectory = "database";

    print("DATABASE // REGISTERED DOCUMENTS", "green");
    separator();

    print("[001] FRESHLlKE INCIDENT", "white");
    print("[817] RASEBALO'S ANOMALY SERVER", "white");
    print("[002] ANOMALY REPORTS ........ LOCKED", "dim");
    print("[003] HUMAN RESEARCH .......... LOCKED", "dim");
    print("[004] AGENT RECORDS ........... LOCKED", "dim");

    separator();
    print("Use OPEN <ID> to access available files.", "dim");
}

function openDocument(id) {
    if (!documents[id]) {
        print("ERROR: DOCUMENT NOT FOUND.", "red");
        return;
    }

    currentProject = id;
    currentDirectory = "document";

    const doc = documents[id];

    separator();
    print("DOCUMENT ACCESS GRANTED", "green");
    print("DOCUMENT // " + id + " // " + doc.project);
    print("TITLE: " + doc.title, "white");
    print("SERVER: " + doc.address);
    print("LEAD: " + doc.lead);
    print("STATUS: " + doc.status);
    separator();

    print("Type READ to display document contents.", "dim");
    print("Type INFO to display document metadata.", "dim");
}

function readDocument() {
    if (!currentProject) {
        print("ERROR: NO DOCUMENT SELECTED.", "red");
        return;
    }

    const doc = documents[currentProject];

    print("READING DOCUMENT // " + currentProject, "green");
    separator();

    doc.sections.forEach((section, index) => {
        print(
            String(index + 1).padStart(2, "0") +
            " // " + section[0],
            "green"
        );

        print(section[1], "white");
        print("");
    });

    separator();
    print("END OF DOCUMENT // " + currentProject, "green");
}

function showInfo() {
    if (!currentProject) {
        print("NO DOCUMENT SELECTED.", "red");
        return;
    }

    const doc = documents[currentProject];

    print("DOCUMENT METADATA", "green");
    separator();
    print("ID: " + currentProject);
    print("TITLE: " + doc.title);
    print("PROJECT: " + doc.project);
    print("SERVER: " + doc.address);
    print("PROJECT LEAD: " + doc.lead);
    print("STATUS: " + doc.status);
    print("SECTIONS: " + doc.sections.length);
    separator();
}

function connect() {
    print("NETWORK GATEWAY // NG-001", "green");
    separator();
    print("ENDPOINT 001: freshlike.gaming");
    print("ENDPOINT 817: rasebalo.fun");
    print("NETWORK TYPE: MINECRAFT JAVA");
    print("CONNECTION STATUS: NOT VERIFIED");
    separator();
    print("This interface displays registered endpoints only.");
    print("It does not establish a live server connection.", "dim");
}

function about() {
    print("NULLPAD", "green");
    separator();
    print("METAPHYSICAL SCIENCES DIVISION");
    print("FOUNDATION: 2013");
    print("PRIMARY FIELD: MINECRAFT SERVER ANOMALIES");
    print("VERSION RANGE: MODERN / LEGACY / ALPHA / BETA");
    print("");
    print("NULLPAD documents unusual world behaviour,");
    print("terrain irregularities, audio reports and");
    print("unexplained server incidents.");
    separator();
}

function execute(raw) {
    const value = raw.trim();
    if (!value) return;

    print("root@nullpad:~$ " + value, "green");

    history.push(value);
    historyIndex = history.length;

    const parts = value.toLowerCase().split(/\s+/);
    const command = parts[0];
    const argument = parts[1];

    switch (command) {
        case "help":
            help();
            break;

        case "status":
            showStatus();
            break;

        case "about":
            about();
            break;

        case "projects":
            showProjects();
            break;

        case "connect":
            connect();
            break;

        case "database":
            showDatabase();
            break;

        case "open":
            if (!argument) {
                print("USAGE: OPEN <DOCUMENT ID>", "red");
            } else {
                openDocument(argument);
            }
            break;

        case "read":
            readDocument();
            break;

        case "info":
            showInfo();
            break;

        case "back":
            currentProject = null;
            showDatabase();
            break;

        case "clear":
            clearScreen();
            break;

        case "date":
            print(new Date().toLocaleString());
            break;

        case "whoami":
            print("USER: NULLPAD OPERATOR");
            print("CLEARANCE: CLASS D", "green");
            break;

        case "logout":
            authenticated = false;
            currentProject = null;
            print("SESSION TERMINATED.", "red");
            print("DEMO TERMINAL: RELOAD PAGE TO RESTART.");
            input.disabled = true;
            break;

        default:
            print("UNKNOWN COMMAND: " + command, "red");
            print("TYPE HELP TO DISPLAY AVAILABLE COMMANDS.", "dim");
    }
}

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        const value = input.value;
        input.value = "";
        execute(value);
    }

    if (event.key === "ArrowUp") {
        event.preventDefault();
        if (historyIndex > 0) {
            historyIndex--;
            input.value = history[historyIndex];
        }
    }

    if (event.key === "ArrowDown") {
        event.preventDefault();
        if (historyIndex < history.length - 1) {
            historyIndex++;
            input.value = history[historyIndex];
        } else {
            historyIndex = history.length;
            input.value = "";
        }
    }

    if (event.key === "Tab") {
        event.preventDefault();
        const commands = [
            "help", "status", "about", "projects",
            "connect", "database", "open 001",
            "open 817", "read", "info", "back",
            "clear", "date", "whoami"
        ];

        const match = commands.find(command =>
            command.startsWith(input.value.toLowerCase())
        );

        if (match) input.value = match;
    }
});

// BOOT SEQUENCE

async function boot() {
    input.disabled = true;

    const messages = [
        ["NULLPAD OPERATING SYSTEM [VERSION 2.4.1]", "green"],
        ["METAPHYSICAL SCIENCES DIVISION", "dim"],
        ["", ""],
        ["INITIALIZING SYSTEM.................. OK", "white"],
        ["LOADING NETWORK MODULE............... OK", "white"],
        ["INITIALIZING DATABASE............... OK", "white"],
        ["LOADING PROJECT ARCHIVE.............. OK", "white"],
        ["VERIFYING LOCAL INTERFACE............ OK", "white"],
        ["", ""],
        ["SYSTEM STATUS: OPERATIONAL", "green"],
        ["GATEWAY ID: NG-001", "green"],
        ["REGISTERED PROJECTS: 02", "green"],
        ["", ""],
        ["WARNING: LIVE SERVER CONNECTION NOT VERIFIED.", "dim"],
        ["", ""],
        ["TYPE 'HELP' TO DISPLAY AVAILABLE COMMANDS.", "green"],
        ["TYPE 'ABOUT' TO LEARN ABOUT NULLPAD.", "dim"],
        ["", ""]
    ];

    for (const [message, color] of messages) {
        print(message, color);
        await new Promise(resolve => setTimeout(resolve, 100));
    }

    authenticated = true;
    connection.textContent = "INTERFACE ONLINE";
    input.disabled = false;
    input.focus();
}

document.addEventListener("click", () => {
    if (!input.disabled) input.focus();
});

setInterval(() => {
    document.getElementById("clock").textContent =
        new Date().toLocaleTimeString();
}, 1000);

boot();
</script>

</body>
</html>
