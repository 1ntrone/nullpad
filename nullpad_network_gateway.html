
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NULLPAD // NG-001</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#020502;color:#62ff80;font-family:Consolas,Monaco,monospace}
.terminal{max-width:1100px;margin:auto;min-height:100vh;padding:22px;display:flex;flex-direction:column}
.top{border-bottom:1px solid #246b36;padding-bottom:14px;margin-bottom:15px}
.logo{font-size:25px;letter-spacing:5px;text-shadow:0 0 12px #36ff63}
.muted{color:#39864c;font-size:12px}
#screen{flex:1;min-height:65vh;overflow-y:auto;white-space:pre-wrap;line-height:1.55;font-size:13px}
.line{margin:0 0 5px}
.system{color:#54b86b}
.error{color:#ff6464}
.warning{color:#e5c66b}
.inputrow{display:flex;gap:9px;align-items:center;border-top:1px solid #246b36;padding-top:14px}
.prompt{white-space:nowrap}
input{background:transparent;border:0;outline:0;color:#8aff9e;font:inherit;flex:1;min-width:0}
button{background:#0b2110;border:1px solid #32894b;color:#70ff8a;padding:9px 15px;font:inherit;cursor:pointer}
button:hover{background:#163a20}
.footer{padding-top:12px;color:#347d45;font-size:11px}
#screen::-webkit-scrollbar{width:5px}
#screen::-webkit-scrollbar-thumb{background:#246b36}
</style>
</head>
<body>
<div class="terminal">
 <div class="top">
  <div class="logo">NULLPAD</div>
  <div class="muted">NETWORK GATEWAY // NG-001</div>
  <div class="muted">METAPHYSICAL SCIENCES DIVISION // COMMAND INTERFACE</div>
  <div class="muted">SYSTEM STATUS: <span style="color:#62ff80">ACTIVE</span></div>
 </div>

 <div id="screen"></div>

 <div class="inputrow">
  <span class="prompt">NP_ROOT &gt;</span>
  <input id="command" autocomplete="off" spellcheck="false" autofocus>
  <button onclick="execute()">ENTER</button>
 </div>
 <div class="footer">NULLPAD TERMINAL // NG-001 // CLASS D SESSION</div>
</div>

<script>
// ==========================================
// NULLPAD CONFIGURATION
// ==========================================

const ACCESS_PASSWORD = "ARCH1VE";
let accessGranted = false;

const screen = document.getElementById("screen");
const input = document.getElementById("command");

function print(text="",type=""){
 const div=document.createElement("div");
 div.className="line "+type;
 div.textContent=text;
 screen.appendChild(div);
 screen.scrollTop=screen.scrollHeight;
}

function divider(){
 print("--------------------------------------------","system");
}

// ==========================================
// AGENT REGISTRY
// ==========================================

const agents = [
 ["NP","OWNER"],
 ["NP_qbvm","D"],
 ["NP_zht","D"],
 ["NP_","A"],
 ["test","A++"]
];

const classes = [
 "A++","A+","A","B++","B+","B",
 "C++","C+","C","D++","D+","D",
 "E++","E+","E","F"
];

const seedNames = [
 "observer","archive","signal","watcher","echo",
 "monitor","cipher","unknown","research","vector",
 "specter","memory","static","phantom","sector",
 "anomaly","witness","protocol","shadow","fragment",
 "terminal","locator","record","scanner","frequency",
 "network","instance","paradox","trace","silence",
 "operator","sentinel","baseline","resonance","gateway",
 "subsystem","recovery","horizon","artifact","channel",
 "sequence","repeater","null","vertex","pattern",
 "index","carrier","boundary","origin","reference",
 "isotope","contour","interval","cluster","signalman",
 "detector","archivex","observerx","monitorx","unknownx",
 "field","marker","transmitter","receiver","specimen",
 "relay","watch","matrix","source","endpoint"
];

function caesar(text,shift){
 return text.replace(/[a-z]/gi,char=>{
  const base=char===char.toUpperCase()?65:97;
  return String.fromCharCode(
   (char.charCodeAt(0)-base+shift+26)%26+base
  );
 });
}

for(let i=0;i<70;i++){
 const original=seedNames[i];
 const shift=i%2===0?-15:-20;
 const alias=caesar(original,shift);
 const className=classes[(i*7+3)%classes.length];
 agents.push(["NP_"+alias+"_"+String(i+1).padStart(2,"0"),className]);
}

// ==========================================
// OPERATION REGISTRY
// ==========================================

const subjects = [
 "Unidentified ambient audio",
 "Irregular terrain generation",
 "Missing world chunks",
 "Unregistered underground structure",
 "Repeated environmental sound",
 "Abnormal entity behaviour",
 "Inconsistent world coordinates",
 "Unusual block formation",
 "Unexpected structure placement",
 "World-generation discrepancy",
 "Unidentified light source",
 "Unusual player reports",
 "Legacy world behaviour",
 "Unstable portal activity",
 "Unregistered entity appearance",
 "Repeated server event",
 "Unknown redstone activation",
 "Inconsistent biome boundaries",
 "Unusual cave geometry",
 "Unidentified audio sequence"
];

const operations=[];

for(let i=1;i<=80;i++){
 const subject=subjects[(i-1)%subjects.length];
 operations.push({
  id:"OP-"+String(i).padStart(3,"0"),
  name:subject,
  status:i%9===0?"SUSPENDED":i%5===0?"UNDER REVIEW":"ACTIVE",
  class:classes[(i*3)%classes.length],
  description:
   "Observation and documentation of "+subject.toLowerCase()+
   ". Record environmental conditions, version information, timestamps and repeatability."
 });
}

operations.push({
 id:"OP-081",
 name:"DEEP SIGNAL",
 status:"RESTRICTED",
 class:"A++",
 description:
 "SPECIAL OPERATION. Senior personnel investigate an unidentified signal reported in a restricted environment. Requires senior authorization, remote observation and documented withdrawal conditions."
});

operations.push({
 id:"OP-082",
 name:"NULL HORIZON",
 status:"RESTRICTED",
 class:"A++",
 description:
 "SPECIAL OPERATION. Joint senior-staff investigation of a persistent world anomaly. Focus: environmental observation, archive preservation and controlled investigation review. Personnel participation requires separate authorization."
});

// ==========================================
// PROJECT DATABASE
// ==========================================

const projects={
 "001":{
  name:"FRESHLlKE",
  address:"freshlike.gaming",
  type:"MINECRAFT JAVA",
  status:"REGISTERED // ACTIVE CASE",
  description:
  "FreshLike is a multiplayer Minecraft environment monitored by the Metaphysical Sciences Division. Reports concern unusual sounds, terrain irregularities, missing chunks and unexplained world behaviour.",
  notes:[
   "PROJECT ID: 001",
   "SERVER: freshlike.gaming",
   "NETWORK: MINECRAFT JAVA",
   "OBSERVATION: ONGOING",
   "LIVE REACHABILITY: NOT VERIFIED"
  ]
 },
 "871":{
  name:"RASEBALO'S ANOMALY SERVER",
  address:"rasebalo.fun",
  type:"MINECRAFT JAVA",
  status:"REGISTERED // ONGOING",
  description:
  "RaseCraft server environment associated with reports of extensive underground passages, audio irregularities and world-generation anomalies.",
  notes:[
   "PROJECT ID: 871",
   "SERVER: rasebalo.fun",
   "NETWORK: MINECRAFT JAVA",
   "OBSERVATION: ONGOING",
   "LIVE REACHABILITY: NOT VERIFIED"
  ]
 }
};

// ==========================================
// SYSTEM LOGS
// ==========================================

const logs=[
 "[08:14:02] NG-001 gateway initialization complete.",
 "[08:14:05] Local command interpreter loaded.",
 "[08:14:08] Agent registry imported.",
 "[08:14:11] Project database mounted.",
 "[08:15:31] PROJECT 001 observation record updated.",
 "[08:17:09] Unusual audio report added to archive.",
 "[08:22:40] OP-014 status changed to UNDER REVIEW.",
 "[09:03:17] PROJECT 871 archive indexed.",
 "[09:41:52] Agent NP_qbvm accessed investigation archive.",
 "[10:12:04] OP-081 access classification confirmed.",
 "[10:30:18] Background archive verification completed.",
 "[11:06:45] Network reachability check unavailable.",
 "[11:42:21] OP-082 marked RESTRICTED.",
 "[12:01:03] Session integrity check passed.",
 "[12:30:00] Gateway status: ACTIVE."
];

// ==========================================
// COMMAND OUTPUTS
// ==========================================

function showHelp(){
 divider();
 print("NULLPAD COMMAND REFERENCE");
 divider();
 print("GENERAL");
 print(" Help                  - Command reference");
 print(" Clear                 - Clear terminal");
 print(" Status                - Gateway status");
 print(" About                 - Interface information");
 print(" Version               - Software version");
 print(" Date                  - System date");
 print(" Whoami                - Current session");
 print("");
 print("DIVISION");
 print(" Who's Nullpad?        - Division profile");
 print(" Service               - Service directory");
 print(" Agents list           - Agent registry");
 print(" Projects              - Registered projects");
 print(" Servers               - Network servers");
 print("");
 print("DATABASE");
 print(" Data                  - Database index");
 print(" Data open 001         - Open project 001");
 print(" Data open 871         - Open project 871");
 print(" Files                 - Archive index");
 print(" Logs                  - System event log");
 print("");
 print("OPERATIONS");
 print(" Operations            - Operation directory");
 print(" Operations status     - All operation statuses");
 print(" Operations open 081   - Special operation details");
 print("");
 print("ACCESS");
 print(" Access                - Access information");
 print(" Access <password>     - Authenticate");
 print(" Help                  - Display this list");
 divider();
}

function showAgents(){
 divider();
 print("NULLPAD // AGENT PERSONNEL REGISTRY");
 print("TOTAL REGISTERED: "+agents.length);
 divider();
 agents.forEach((a,i)=>{
  print(String(i+1).padStart(3,"0")+" | "+a[0].padEnd(27)+" | CLASS "+a[1]);
 });
 divider();
}

function showServices(){
 divider();
 print("NULLPAD SERVICE DIRECTORY");
 divider();
 print("SVC-001 // GATEWAY");
 print("Central network interface and project routing.");
 print("STATUS: ACTIVE");
 print("");
 print("SVC-002 // ARCHIVE MANAGEMENT");
 print("Indexes investigation files and preserves records.");
 print("STATUS: ACTIVE");
 print("");
 print("SVC-003 // PERSONNEL REGISTRY");
 print("Maintains agent identifiers and authorization classes.");
 print("STATUS: ACTIVE");
 print("");
 print("SVC-004 // OBSERVATION DESK");
 print("Receives reports and assigns investigation references.");
 print("STATUS: ACTIVE");
 print("");
 print("SVC-005 // SIGNAL ANALYSIS");
 print("Catalogues unusual audio and environmental reports.");
 print("STATUS: ACTIVE");
 print("");
 print("SVC-006 // WORLD INTEGRITY");
 print("Documents terrain, chunk and world-generation anomalies.");
 print("STATUS: ACTIVE");
 print("");
 print("SVC-007 // ACCESS CONTROL");
 print("Checks local authorization for restricted records.");
 print("STATUS: ACTIVE");
 divider();
}

function showProjects(){
 divider();
 print("REGISTERED NETWORK PROJECTS");
 divider();
 Object.keys(projects).forEach(id=>{
  const p=projects[id];
  print("PROJECT "+id+" // "+p.name);
  print("ADDRESS: "+p.address);
  print("STATUS: "+p.status);
  print("");
 });
 print("NOTE: Registration does not confirm live connectivity.");
 divider();
}

function openData(id){
 const p=projects[id];
 if(!p){
  print("DATABASE ERROR: FILE NOT FOUND.","error");
  return;
 }
 divider();
 print("DATABASE FILE // PROJECT "+id);
 divider();
 p.notes.forEach(x=>print(x));
 print("");
 print("PROJECT DESCRIPTION:");
 print(p.description);
 print("");
 print("ARCHIVE STATUS: REGISTERED");
 print("INTERPRETATIONS: PROVISIONAL");
 divider();
}

function showOperations(){
 divider();
 print("NULLPAD // OPERATIONS DIRECTORY");
 print("TOTAL OPERATIONS: "+operations.length);
 divider();
 operations.forEach(o=>{
  print(o.id+" | "+o.name+" | "+o.status+" | CLASS "+o.class);
 });
 divider();
}

function operationDetails(id){
 const o=operations.find(x=>x.id===id.toUpperCase()||
  x.id==="OP-"+id.padStart(3,"0"));
 if(!o){
  print("OPERATION NOT FOUND.","error");
  return;
 }
 if(o.status==="RESTRICTED"&&!accessGranted){
  print("ACCESS DENIED: RESTRICTED OPERATION.","error");
  print("AUTHORIZATION REQUIRED. USE ACCESS.");
  return;
 }
 divider();
 print("OPERATION RECORD // "+o.id);
 print("TITLE: "+o.name);
 print("STATUS: "+o.status);
 print("REQUIRED CLASS: "+o.class);
 print("");
 print(o.description);
 divider();
}

function showLogs(){
 divider();
 print("NULLPAD // SYSTEM EVENT LOG");
 divider();
 logs.forEach(x=>print(x));
 divider();
}

function showStatus(){
 divider();
 print("GATEWAY STATUS REPORT");
 print("GATEWAY ID: NG-001");
 print("SYSTEM: ACTIVE");
 print("SESSION: OPERATIONAL");
 print("ACCESS LEVEL: CLASS D");
 print("REGISTERED PROJECTS: 02");
 print("REGISTERED AGENTS: "+agents.length);
 print("REGISTERED OPERATIONS: "+operations.length);
 print("DATABASE: MOUNTED");
 print("ARCHIVE: AVAILABLE");
 print("LIVE SERVER CONNECTION: NOT VERIFIED");
 divider();
}

function showNullpad(){
 divider();
 print("NULLPAD // DIVISION PROFILE");
 divider();
 print("NULLPAD is a classified subdivision of the");
 print("Metaphysical Sciences Department, established in 2013.");
 print("");
 print("PRIMARY FIELD:");
 print("Minecraft server anomalies and irregular phenomena.");
 print("");
 print("The division documents unusual world behaviour,");
 print("terrain irregularities, unexplained sounds,");
 print("inconsistent mechanics and anomalous entities.");
 print("");
 print("Reports are treated as records, not conclusions.");
 print("Observations are preserved with version details,");
 print("timestamps and repeatability notes wherever available.");
 print("");
 print("FOUNDATION: 2013");
 print("PARENT: Metaphysical Sciences Department");
 print("REGISTERED PROJECTS: 02");
 print("RECORD STATUS: CLASSIFIED / ONGOING");
 divider();
}

// ==========================================
// COMMAND INTERPRETER
// ==========================================

function execute(){
 const raw=input.value.trim();
 if(!raw)return;
 input.value="";

 print("NP_ROOT > "+raw);
 const parts=raw.split(/\s+/);
 const command=parts[0].toLowerCase();
 const arg=(parts[1]||"").toLowerCase();
 const arg2=(parts[2]||"").toLowerCase();

 if(command==="clear"){
  screen.innerHTML="";
  return;
 }

 if(command==="help"){
  showHelp();
 }
 else if(command==="agents"){
  if(arg==="list"||!arg)showAgents();
  else print("USAGE: Agents list","warning");
 }
 else if(command==="service"||command==="services"){
  showServices();
 }
 else if(command==="servers"||command==="projects"){
  showProjects();
 }
 else if(command==="data"){
  if(arg==="open"&&arg2){
   openData(arg2);
  }else{
   divider();
   print("DATABASE INDEX");
   print("001 // FRESHLlKE ARCHIVE");
   print("871 // RASEBALO ARCHIVE");
   print("USAGE: Data open <id>");
   divider();
  }
 }
 else if(command==="operations"){
  if(arg==="status"||!arg){
   showOperations();
  }else if(arg==="open"&&arg2){
   operationDetails(arg2);
  }else{
   print("USAGE: Operations status");
   print("       Operations open <id>");
  }
 }
 else if(command==="logs"){
  showLogs();
 }
 else if(command==="status"){
  showStatus();
 }
 else if(command==="who's"||raw.toLowerCase()==="who's nullpad?"||
         raw.toLowerCase()==="who's nullpad"){
  showNullpad();
 }
 else if(command==="about"){
  showNullpad();
 }
 else if(command==="access"){
  if(!arg){
   divider();
   print("NULLPAD ACCESS CONTROL");
   print("Restricted records require an authorization key.");
   print("USAGE: Access <password>");
   print("SESSION ACCESS: "+(accessGranted?"ELEVATED":"CLASS D"));
   divider();
  }else if(raw.slice(raw.indexOf(" ")+1)===ACCESS_PASSWORD){
   accessGranted=true;
   print("AUTHORIZATION ACCEPTED.","system");
   print("RESTRICTED SESSION ENABLED.");
  }else{
   print("AUTHORIZATION FAILED.","error");
   print("INVALID ACCESS KEY.");
  }
 }
 else if(command==="files"){
  divider();
  print("ARCHIVE FILE INDEX");
  print("DB-001 // FRESHLlKE");
  print("DB-871 // RASEBALO");
  print("OPERATION RECORDS // 082");
  print("PERSONNEL REGISTRY");
  print("SYSTEM LOGS");
  divider();
 }
 else if(command==="connect"){
  print("REGISTERED ENDPOINTS:");
  print("freshlike.gaming");
  print("rasebalo.fun");
  print("LIVE REACHABILITY: NOT VERIFIED.","warning");
 }
 else if(command==="whoami"){
  print("SESSION USER: NP_ROOT");
  print("ACCESS CLASS: D");
  print("SESSION: ACTIVE");
 }
 else if(command==="version"){
  print("NULLPAD COMMAND INTERFACE");
  print("VERSION: 1.0.0");
  print("GATEWAY BUILD: NG-001");
 }
 else if(command==="date"){
  print("LOCAL SYSTEM DATE: "+new Date().toLocaleString());
 }
 else if(command==="logout"){
  accessGranted=false;
  print("SESSION ACCESS RESET.");
 }
 else{
  print("UNKNOWN COMMAND: "+raw,"error");
  print("Type Help to see available commands.");
 }
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter")execute();
});

print("NULLPAD NETWORK GATEWAY");
print("METAPHYSICAL SCIENCES DIVISION");
print("COMMAND INTERFACE VERSION 1.0.0");
divider();
print("GATEWAY INITIALIZATION COMPLETE.");
print("SESSION STATUS: ACTIVE.");
print("REGISTERED AGENTS: "+agents.length);
print("REGISTERED OPERATIONS: "+operations.length);
print("TYPE Help TO DISPLAY COMMANDS.");
divider();
</script>
</body>
</html>
