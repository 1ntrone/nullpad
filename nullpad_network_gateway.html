// OUTPUT QUEUE AND ANIMATIONS

let outputQueue = Promise.resolve();
let outputGeneration = 0;

function sleep(ms){
 return new Promise(resolve=>setTimeout(resolve,ms));
}

function nextFrame(){
 return new Promise(resolve=>requestAnimationFrame(resolve));
}

async function animateLine(div){
 div.style.opacity = "0";
 div.style.transform = "translateY(9px)";
 div.style.filter = "brightness(1.8)";

 await nextFrame();
 await nextFrame();

 div.animate(
  [
   {
    opacity:0,
    transform:"translateY(9px)",
    filter:"brightness(1.8)"
   },
   {
    opacity:1,
    transform:"translateY(0)",
    filter:"brightness(1)"
   }
  ],
  {
   duration:420,
   easing:"cubic-bezier(.2,.8,.2,1)",
   fill:"forwards"
  }
 );
}

function print(text="",type=""){
 const generation = outputGeneration;

 outputQueue = outputQueue.then(async()=>{
  if(generation !== outputGeneration)return;

  const div = document.createElement("div");
  div.className = "line " + type;

  screen.appendChild(div);

  await animateLine(div);

  const content = String(text);

  if(content.length === 0){
   div.textContent = "";
   screen.scrollTop = screen.scrollHeight;
   return;
  }

  const speed =
   content.length > 100 ? 1 :
   content.length > 60 ? 2 : 8;

  for(let i=0;i<content.length;i++){
   if(generation !== outputGeneration)return;

   div.textContent = content.slice(0,i+1);
   screen.scrollTop = screen.scrollHeight;

   await sleep(speed);
  }

  screen.scrollTop = screen.scrollHeight;
  await sleep(65);
 });

 return outputQueue;
}

function divider(){
 print("--------------------------------------------","system");
}

function clearScreen(){
 outputGeneration++;
 outputQueue = Promise.resolve();
 screen.innerHTML = "";
}

 prompt.textContent = authenticated ? "NP_ROOT >" : "LOGIN >";

function caesar(text,shift){
 return text.replace(/[a-z]/gi,char=>{
  const base=char===char.toUpperCase()?65:97;

  return String.fromCharCode(
   (char.charCodeAt(0)-base+shift+26)%26+base
  );
 });
}

function authenticate(password){
 if(authenticated){
  print("SESSION ALREADY ACTIVE.","warning");
  return;
 }

 if(password!==LOGIN_PASSWORD){
  print("AUTHENTICATION FAILED.","error");
  print("INVALID CREDENTIALS.");
  audit("Failed login attempt.");
  return;
 }

 authenticated=true;
 accessGranted=false;

 updateSession();

 print("AUTHENTICATION ACCEPTED.","success");
 print("SESSION: ACTIVE");
 print("CLEARANCE: STANDARD");
 print("WELCOME TO NULLPAD NETWORK GATEWAY.");

 audit("Standard session authenticated.");
}

function grantAccess(key){
 if(!authenticated){
  print("AUTHENTICATION REQUIRED.","error");
  print("LOGIN BEFORE REQUESTING CLEARANCE.");

 }

 if(accessGranted){

  return;
 }

 if(key!==ACCESS_PASSWORD){
  print("AUTHORIZATION FAILED.","error");
  print("INVALID AUTHORIZATION KEY.");
  audit("Failed clearance request.");
  return;
 }

 accessGranted=true;
 updateSession();

 print("AUTHORIZATION ACCEPTED.","success");
 print("RESTRICTED SESSION ENABLED.");
 print("CLEARANCE: ELEVATED");
 print("RESTRICTED ARCHIVES: UNLOCKED");

 audit("Elevated clearance granted.");
}

 audit("Session terminated.");
}

function execute(){
 const raw=input.value.trim();
 if(!raw)return;

 input.value="";

 print((authenticated?"NP_ROOT > ":"LOGIN > ")+raw);

 commandHistory.push(raw);
 historyPosition=commandHistory.length;

 const parts=raw.split(/\s+/);
 const command=parts[0].toLowerCase();
 const arg=parts[1]||"";
 const argLower=arg.toLowerCase();
 const arg2=parts[2]||"";

 if(command==="login"){
  const password=raw.slice(parts[0].length).trim();

  if(!password){
   print("USAGE: LOGIN <password>","warning");
  }else{
   authenticate(password);
  }

  return;
 }

 if(command==="clear"){
  clearScreen();
  return;
 }

 if(!authenticated){
  if(command==="help"){
   divider();
   print("NULLPAD NETWORK GATEWAY");
   print("AUTHENTICATION REQUIRED.");
   print("USAGE: LOGIN <password>");
   print("SESSION STATUS: LOCKED");
   divider();
  }else{
   print("AUTHENTICATION REQUIRED.","error");
   print("EXECUTION BLOCKED.");
   print("USE: LOGIN <password>","warning");
  }

  return;
 }

 if(command==="logout"){
  logout();
 }

 else if(command==="help"){
  showHelp();
 }

 else if(command==="access"){
  if(!arg){
   showAccess();
  }else{
   grantAccess(raw.slice(raw.indexOf(" ")+1).trim());
  }
 }

 else if(command==="status"){
  showStatus();
 }

 else if(command==="whoami"){
  divider();
  print("SESSION USER: NP_ROOT");
  print("ACCESS CLASS: "+(accessGranted?"ELEVATED":"STANDARD"));
  print("SESSION: ACTIVE");
  print("AUTHENTICATION: VERIFIED");
  divider();
 }

 else if(
  command==="about"||
  raw.toLowerCase()==="who's nullpad?"||
  raw.toLowerCase()==="who's nullpad"
 ){
  showNullpad();
 }

 else if(command==="version"){
  print("NULLPAD COMMAND INTERFACE");
  print("VERSION: 1.2.0");
  print("GATEWAY BUILD: NG-001");
  print("ACCESS CONTROL: ENABLED");
 }

 else if(command==="date"){
  print("LOCAL SYSTEM DATE: "+new Date().toLocaleString());
 }

 else if(command==="service"||command==="services"){
  showServices();
 }

 else if(command==="projects"||command==="servers"){
  showProjects();
 }

 else if(command==="agents"){
  if(argLower==="list"||!arg){
   showAgents();
  }else{
   print("USAGE: Agents list","warning");
  }
 }

 else if(command==="data"){
  if(argLower==="open"&&arg2){
   openData(arg2);
  }else{
   showDataIndex();
  }
 }

 else if(command==="operations"){
  if(argLower==="status"||!arg){
   showOperations();
  }else if(argLower==="open"&&arg2){
   operationDetails(arg2);
  }else{
   print("USAGE: Operations status");
   print("       Operations open <id>");
  }
 }

 else if(command==="logs"){
  showLogs();
 }

 else if(command==="files"){
  if(!requireElevated())return;

  divider();
  print("ARCHIVE FILE INDEX");
  divider();
  print("DB-001 // FRESHLlKE");
  print("DB-871 // RASEBALO");
  print("OPERATION RECORDS // 082");
  print("PERSONNEL REGISTRY");
  print("SYSTEM LOGS");
  print("ARCHIVE INTEGRITY: VERIFIED");
  divider();
 }

 else if(command==="connect"){
  print("REGISTERED ENDPOINTS:");
  print("freshlike.gaming");
  print("rasebalo.fun");
  print("LIVE REACHABILITY: NOT VERIFIED.","warning");
  print("CONNECTION TEST: NOT PERFORMED.");
 }

 else{
  print("UNKNOWN COMMAND: "+raw,"error");
  print("Type Help to see available commands.");
 }
}

// ==========================================
// COMMAND HISTORY
// ==========================================

input.addEventListener("keydown",e=>{
 if(e.key==="Enter"){
  execute();
 }

 if(e.key==="ArrowUp"){
  e.preventDefault();

  if(historyPosition>0){
   historyPosition--;
   input.value=commandHistory[historyPosition];
  }
 }

 if(e.key==="ArrowDown"){
  e.preventDefault();

  if(historyPosition<commandHistory.length-1){
   historyPosition++;
   input.value=commandHistory[historyPosition];
  }else{
   historyPosition=commandHistory.length;
   input.value="";
  }
 }
});

// ==========================================

async function boot(){

 clearScreen();

 const bootLine=async(text,type="system")=>{
  await print(text,type);
  await sleep(120);
 };

 await sleep(500);

 await bootLine("NULLPAD NETWORK GATEWAY");
 await bootLine("METAPHYSICAL SCIENCES DIVISION");
 await bootLine("INITIALIZING NG-001...");
 await bootLine("--------------------------------------------");

 await bootLine("[ OK ] Local interface initialized.");
 await bootLine("[ OK ] Command interpreter loaded.");
 await bootLine("[ OK ] Database mounted.");
 await bootLine("[ OK ] Agent registry indexed.");
 await bootLine("[ OK ] Operation registry indexed.");
 await bootLine("[ OK ] Archive integrity checked.");
 await bootLine("[ OK ] Authentication service ready.");

 await bootLine("--------------------------------------------");

 await bootLine("SYSTEM INITIALIZATION: COMPLETE","success");
 await bootLine("GATEWAY STATUS: ACTIVE","success");

 await bootLine("REGISTERED AGENTS: "+agents.length);
 await bootLine("REGISTERED OPERATIONS: "+operations.length);

 await sleep(350);

 await bootLine("--------------------------------------------");

 await bootLine("AUTHENTICATION REQUIRED.","warning");
 await bootLine("USE LOGIN <password> TO BEGIN.");
 await bootLine("SESSION STATUS: LOCKED");

 await bootLine("--------------------------------------------");

 updateSession();
 input.focus();
}

updateSession();
boot();
