
<script>
// ========================================
// NULLPAD ACCESS ROTATION SYSTEM
// ========================================

const gate = document.getElementById('gate');
const site = document.getElementById('site');

const accessCodes = [
    'NP',
    'MSD',
    'NP_qbvm'
];

// Get current visit number
let visit = Number(localStorage.getItem('nullpad-visit') || 0);

// Select password for this visit
const currentPassword = accessCodes[visit % accessCodes.length];

// Save next visit number
localStorage.setItem('nullpad-visit', visit + 1);

// ========================================
// AUTHENTICATION
// ========================================

document.getElementById('login').addEventListener('submit', e => {
    e.preventDefault();

    const enteredPassword =
        document.getElementById('password').value;

    if (enteredPassword === currentPassword) {
        gate.style.display = 'none';
        site.hidden = false;
    } else {
        document.getElementById('error').textContent =
            'ACCESS DENIED // INVALID CODE';
    }
});

// Reset authentication when page is restored
window.addEventListener('pageshow', () => {
    gate.style.display = 'grid';
    site.hidden = true;

    document.getElementById('password').value = '';
    document.getElementById('error').textContent = '';
});

// ========================================
// DATABASE SEARCH
// ========================================

const search = document.getElementById('search');

const files = [
    ...document.querySelectorAll('#files .file')
];

const empty = document.getElementById('empty');

search.addEventListener('input', () => {
    let count = 0;

    files.forEach(file => {
        const match = file.dataset.search.includes(
            search.value.trim().toLowerCase()
        );

        file.style.display = match ? 'flex' : 'none';

        if (match) count++;
    });

    empty.style.display = count ? 'none' : 'block';
});

// ========================================
// FILE NAVIGATION
// ========================================

const view = document.getElementById('file-001');
const section = document.getElementById('database');
const center = document.querySelector('.center');

document.querySelector('a[href="#file-001"]')
.addEventListener('click', e => {
    e.preventDefault();

    view.classList.add('active');
    section.style.display = 'none';
    center.style.display = 'none';

    history.replaceState(null, '', '#file-001');
});

document.getElementById('back').addEventListener('click', () => {
    view.classList.remove('active');

    section.style.display = 'block';
    center.style.display = 'block';

    history.replaceState(null, '', location.pathname);
});

// ========================================
// FOOTER
// ========================================

document.getElementById('year').textContent =
    new Date().getFullYear();

</script>
